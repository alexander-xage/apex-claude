name: ci

# CI runs on release candidates only: push a tag like v0.3.0-rc.1 before
# publishing v0.3.0. Ordinary pushes and pull requests do not trigger it, which
# keeps the 3-OS matrix (macOS is the costly job on a private repo) off every
# commit. "Run workflow" on the Actions tab runs it on demand for any ref.
on:
  push:
    tags: ['v*-rc*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Windows and macOS run the full suite too: the auto-update binary swap,
    # its rollback, and the .old sweep are Windows-only code paths, and darwin
    # binaries ship in every release. Ubuntu-only CI never executed any of it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true
          # Zero-dependency module: there is no go.sum to key the cache on.
          cache-dependency-path: go.mod

      # Formatting is OS-independent, and a Windows checkout converts line
      # endings to CRLF, which gofmt would flag on every file.
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      # go build, not make: make is not guaranteed on Windows runners. The
      # flags mirror the Makefile's build target.
      - name: build
        run: |
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          go build -trimpath -ldflags "-s -w" -o "bin/apex$ext" ./cmd/apex

      - name: doctor
        run: ./bin/apex doctor

      - name: validate
        run: ./bin/apex validate all
